[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "magicou-recognizer"
version = "0.3.0"
description = "Self-hosted, multi-signal Magic card retrieval with Scryfall printing identities"
readme = "README.md"
keywords = ["magic-the-gathering", "mtg", "card-recognition", "computer-vision", "scryfall", "onnx"]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy==2.2.6", "Pillow==12.3.0", "opencv-python-headless==4.12.0.88",
  "onnxruntime==1.26.0", "httpx==0.28.1",
  "fastapi==0.139.1", "uvicorn==0.51.0", "python-multipart==0.0.32",
]

[project.optional-dependencies]
ocr = ["rapidocr==3.9.1"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
magicou-recognizer = "arcana.cli:main"
magic-recognizer = "arcana.cli:main"
arcana = "arcana.cli:main"

[project.urls]
Repository = "https://github.com/GonnRuiz/magicou-recognizer"
Documentation = "https://github.com/GonnRuiz/magicou-recognizer#readme"
Issues = "https://github.com/GonnRuiz/magicou-recognizer/issues"

[tool.setuptools.packages.find]
include = ["arcana*", "magicou_recognizer*", "magic_recognizer*"]

[tool.setuptools.package-data]
arcana = ["assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
